<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0A">
<title>VIDPOD Swipe Review</title>
<style>
@font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Inter"; src: url("fonts/Inter-var.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }
/* VIDPOD tokens (same values as index.html, dark set: this page is for looking at footage) */
:root {
  --bg: #0A0A0A; --bg-2: #121212; --bg-3: #1C1C1C; --fg: #FAFAF7; --muted: #9A9A9A;
  --line: #242424; --line-strong: #3A3A3A; --green: #00FFAA; --on-green: #000000; --no: #FF5A5A;
  --font-head: 'Archivo Black', 'Arial Black', 'Helvetica Neue', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ease: cubic-bezier(.2, .7, .1, 1);
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
body { overflow: hidden; overscroll-behavior: none; }
.app { display: flex; flex-direction: column; height: 100vh; height: 100svh; padding: env(safe-area-inset-top, 0px) var(--gut-r) env(safe-area-inset-bottom, 0px) var(--gut-l); max-width: 560px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 10px; height: 52px; flex: 0 0 auto; }
.brand { font-family: var(--font-head); font-size: 18px; letter-spacing: -.01em; }
.brand i { font-style: normal; color: var(--green); }
.sub { color: var(--muted); font-size: 13px; }
.count { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.mode { border: 1px solid var(--line-strong); background: transparent; color: var(--fg); border-radius: 999px; padding: 6px 10px; font: 600 12px var(--font-body); }
.mode[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.stage { position: relative; flex: 1 1 auto; min-height: 0; margin: 4px 0 10px; }
.card { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 0 1px var(--line); touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform; }
.card.back { transform: scale(.95) translateY(10px); opacity: .55; pointer-events: none; }
.card.fly { transition: transform .32s var(--ease), opacity .32s var(--ease); }
.card.snap { transition: transform .25s var(--ease); }
.media { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
.media img, .media video { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.info { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 16px 16px; background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.75) 55%, rgba(0,0,0,0) 100%); }
.chip { display: inline-block; font: 700 11px var(--font-body); text-transform: uppercase; letter-spacing: .06em; background: var(--green); color: var(--on-green); border-radius: 999px; padding: 4px 9px; }
.chip.id { background: rgba(255,255,255,.14); color: var(--fg); margin-left: 6px; }
.title { font-family: var(--font-head); font-size: 22px; line-height: 1.1; margin: 8px 0 6px; letter-spacing: -.01em; }
.note { font-size: 14px; line-height: 1.35; color: #D8D8D2; margin: 0 0 8px; }
.src { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.src a { color: var(--green); text-decoration: none; font-weight: 600; padding: 6px 0; }
.stamp { position: absolute; top: 22px; padding: 6px 12px; border: 3px solid; border-radius: 10px; font-family: var(--font-head); font-size: 26px; opacity: 0; transform: rotate(-10deg); pointer-events: none; }
.stamp.yes { left: 18px; color: var(--green); border-color: var(--green); }
.stamp.no { right: 18px; color: var(--no); border-color: var(--no); transform: rotate(10deg); }
.stamp.later { left: 50%; top: 40%; color: #fff; border-color: #fff; transform: translateX(-50%); }
.actions { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding-bottom: 10px; }
.btn { height: 60px; border-radius: 18px; border: 1px solid var(--line-strong); background: var(--bg-2); color: var(--fg); font: 700 15px var(--font-body); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.btn:active { transform: scale(.97); }
.btn.no { color: var(--no); }
.btn.yes { background: var(--green); color: var(--on-green); border-color: var(--green); }
.btn svg { width: 20px; height: 20px; }
.foot { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); padding-bottom: 8px; min-height: 28px; }
.link { background: none; border: 0; color: var(--fg); font: 600 12px var(--font-body); padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.done { position: absolute; inset: 0; overflow: auto; padding: 8px 2px 20px; display: none; }
.done.on { display: block; }
.done h2 { font-family: var(--font-head); font-size: 26px; margin: 8px 0 4px; }
.done p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
.list h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
.row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.row img { width: 44px; height: 78px; object-fit: cover; border-radius: 8px; background: #000; flex: 0 0 auto; }
.row b { display: block; font-size: 14px; }
.row a { color: var(--green); font-size: 12px; text-decoration: none; }
.row span { color: var(--muted); font-size: 12px; }
.donebtns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.donebtns .btn { height: 46px; padding: 0 14px; font-size: 14px; flex: 1 1 auto; }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: var(--fg); color: var(--bg); font: 600 13px var(--font-body); border-radius: 999px; padding: 8px 14px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.hint { position: absolute; inset: auto 0 0 0; text-align: center; color: var(--muted); font-size: 12px; }
@media (min-width: 700px) { .title { font-size: 26px; } }
@media (prefers-reduced-motion: reduce) { .card.fly, .card.snap { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">VIDPOD<i>.</i></div>
    <div class="sub">Swipe review</div>
    <div class="count" id="count">0 / 0</div>
    <button class="mode" id="mode" aria-pressed="false" title="Show only items saved for later">Saved</button>
  </header>
  <div class="stage" id="stage">
    <div class="done" id="done"></div>
  </div>
  <div class="actions" id="actions">
    <button class="btn no" id="bNo" aria-label="No (swipe left)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>No</button>
    <button class="btn" id="bLater" aria-label="Save for later (swipe up)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Later</button>
    <button class="btn yes" id="bYes" aria-label="Yes (swipe right)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Yes</button>
  </div>
  <div class="foot"><button class="link" id="undo">Undo</button><span id="status">Right yes, left no, up later</span><button class="link" id="summary">Results</button></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function () {
  "use strict";
  var KEY = "vidpod-review-v1";
  var QUEUE = [], ITEMS = {}, LOG_URL = "", NAME = "Tommy", CODE = "", VERSION = "";
  var state = load();
  var savedOnly = false, current = null, busy = false;
  var stage = document.getElementById("stage"), doneEl = document.getElementById("done");

  function local(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function load() { var s = null; try { s = JSON.parse(local(KEY) || "null"); } catch (e) {} return s && s.decisions ? s : { decisions: {}, history: [], outbox: [] }; }
  function save() { local(KEY, JSON.stringify(state)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("on"); }, 1400); }
  function status(t) { document.getElementById("status").textContent = t; }

  // ---------- data ----------
  Promise.all([
    fetch("review-queue.json", { cache: "no-store" }).then(function (r) { return r.json(); }),
    fetch("codes.json", { cache: "no-store" }).then(function (r) { return r.json(); }).catch(function () { return {}; })
  ]).then(function (res) {
    var q = res[0] || {}, cfg = res[1] || {};
    VERSION = q.version || "";
    QUEUE = (q.items || []).filter(function (it) { return it && it.id && (it.image || it.video); });
    QUEUE.forEach(function (it) { ITEMS[it.id] = it; });
    LOG_URL = /^https:\/\//.test(cfg.log_endpoint || "") ? cfg.log_endpoint : "";
    try { var s = JSON.parse(local("vidpod-studio-signin") || "null"); if (s && s.name) { NAME = s.name; CODE = s.code || ""; } } catch (e) {}
    flush();
    render();
  }).catch(function () {
    doneEl.classList.add("on");
    doneEl.innerHTML = "<h2>Could not load the queue</h2><p>Open this page from the site (or a local server), not as a file.</p>";
  });

  function pending() {
    return QUEUE.filter(function (it) {
      var d = state.decisions[it.id];
      return savedOnly ? (d && d.d === "later") : !d;
    });
  }
  function counts() { var c = { yes: 0, no: 0, later: 0 }; Object.keys(state.decisions).forEach(function (k) { var d = state.decisions[k].d; if (c[d] != null) c[d]++; }); return c; }

  // ---------- render ----------
  function cardHTML(it) {
    var media = it.video
      ? '<video muted loop playsinline autoplay preload="auto"' + (it.image ? ' poster="' + esc(it.image) + '"' : "") + ' src="' + esc(it.video) + '"></video>'
      : '<img alt="" src="' + esc(it.image) + '">';
    return '<div class="media">' + media + '</div>' +
      '<div class="stamp yes">YES</div><div class="stamp no">NO</div><div class="stamp later">LATER</div>' +
      '<div class="info"><span class="chip">' + esc(it.type) + '</span><span class="chip id">' + esc(it.id) + '</span>' +
      '<div class="title">' + esc(it.title) + '</div>' +
      (it.note ? '<p class="note">' + esc(it.note) + '</p>' : "") +
      '<div class="src">' + esc(it.source || "") + (it.link ? ' <a href="' + esc(it.link) + '" target="_blank" rel="noopener noreferrer">Open source</a>' : "") + '</div></div>';
  }
  function render() {
    Array.prototype.slice.call(stage.querySelectorAll(".card")).forEach(function (c) { c.remove(); });
    var list = pending();
    var total = savedOnly ? list.length : QUEUE.length;
    var doneN = savedOnly ? 0 : QUEUE.length - list.length;
    document.getElementById("count").textContent = savedOnly ? (list.length + " saved") : (Math.min(doneN + 1, total) + " / " + total);
    var show = !!list.length;
    document.getElementById("actions").style.visibility = show ? "visible" : "hidden";
    if (!show) { current = null; showDone(); return; }
    doneEl.classList.remove("on");
    if (list[1]) stage.appendChild(makeCard(list[1], true));
    current = makeCard(list[0], false);
    stage.appendChild(current);
    bindDrag(current);
  }
  function makeCard(it, back) {
    var c = document.createElement("div");
    c.className = "card" + (back ? " back" : "");
    c.dataset.id = it.id;
    c.innerHTML = cardHTML(it);
    var v = c.querySelector("video"); if (v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    return c;
  }
  function showDone() {
    var c = counts();
    var yes = QUEUE.filter(function (it) { return (state.decisions[it.id] || {}).d === "yes"; });
    var later = QUEUE.filter(function (it) { return (state.decisions[it.id] || {}).d === "later"; });
    function rows(arr) {
      return arr.length ? arr.map(function (it) {
        return '<div class="row"><img alt="" src="' + esc(it.image || "") + '"><div><b>' + esc(it.title) + '</b><span>' + esc(it.id + " · " + it.type) + '</span><br>' +
          (it.link ? '<a href="' + esc(it.link) + '" target="_blank" rel="noopener noreferrer">Open source</a>' : "") + '</div></div>';
      }).join("") : '<p>None yet.</p>';
    }
    var left = QUEUE.length - Object.keys(state.decisions).length;
    doneEl.innerHTML = '<h2>' + (savedOnly && !pending().length ? "No saved items left" : left > 0 ? "Results so far" : "All done") + '</h2>' +
      '<p>' + c.yes + ' yes, ' + c.no + ' no, ' + c.later + ' saved for later. ' + (LOG_URL ? "Sent to the VIDPOD sheet." : "Kept on this phone (the sheet link is not set yet).") + '</p>' +
      '<div class="donebtns">' + (c.later ? '<button class="btn" id="dSaved">Go through saved</button>' : "") +
      '<button class="btn" id="dCopy">Copy results</button><button class="btn" id="dReset">Start over</button></div>' +
      '<div class="list"><h3>Yes</h3>' + rows(yes) + '<h3>Saved for later</h3>' + rows(later) + '</div>';
    doneEl.classList.add("on");
    var s = document.getElementById("dSaved"); if (s) s.onclick = function () { setMode(true); };
    document.getElementById("dCopy").onclick = copyResults;
    document.getElementById("dReset").onclick = function () {
      if (!confirm("Clear every decision on this phone and start again? Rows already sent to the sheet stay there.")) return;
      state.decisions = {}; save(); setMode(false);
    };
  }

  // ---------- decisions ----------
  function decide(d, how) {
    if (!current || busy) return;
    busy = true;
    var card = current, id = card.dataset.id, it = ITEMS[id];
    var at = new Date().toISOString();
    var prev = state.decisions[id] ? state.decisions[id].d : "";
    state.decisions[id] = { d: d, at: at };
    state.history.push({ id: id, d: d, prev: prev, at: at });
    if (state.history.length > 500) state.history = state.history.slice(-500);
    send(it, d, at, prev);
    save();
    var w = window.innerWidth;
    var tx = d === "yes" ? w * 1.3 : d === "no" ? -w * 1.3 : 0, ty = d === "later" ? -window.innerHeight * 1.1 : 40;
    var rot = d === "yes" ? 18 : d === "no" ? -18 : 0;
    card.classList.remove("snap"); card.classList.add("fly");
    card.querySelector(".stamp." + d).style.opacity = 1;
    requestAnimationFrame(function () { card.style.transform = "translate(" + tx + "px," + ty + "px) rotate(" + rot + "deg)"; card.style.opacity = 0; });
    setTimeout(function () { busy = false; render(); }, how === "key" ? 220 : 300);
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  }
  function undo() {
    var h = state.history.pop();
    if (!h) { toast("Nothing to undo"); return; }
    if (h.prev) state.decisions[h.id] = { d: h.prev, at: new Date().toISOString() }; else delete state.decisions[h.id];
    save();
    send(ITEMS[h.id], "undo", new Date().toISOString(), h.d);
    if (savedOnly && h.prev !== "later") setMode(false); else render();
    toast("Undone: " + (ITEMS[h.id] ? ITEMS[h.id].title : h.id));
  }
  function setMode(on) { savedOnly = on; document.getElementById("mode").setAttribute("aria-pressed", on ? "true" : "false"); render(); }

  // ---------- logging: Google Sheet tab "Review" + local outbox ----------
  function send(it, d, at, prev) {
    if (!it) return;
    var row = { section: it.type, optionCode: it.id, label: it.title,
      settings: { decision: d, previous: prev || "", at: at, source: it.source || "", link: it.link || "" }, note: d };
    state.outbox.push(row); save(); flush();
  }
  function flush() {
    if (!LOG_URL || !state.outbox.length || flush.on) { if (!LOG_URL) status("Saved on this phone"); return; }
    flush.on = true;
    var rows = state.outbox.slice(0, 40);
    var body = JSON.stringify({ tab: "Review", name: NAME, client: "VIDPOD", project: "Swipe review", code: CODE, version: "review " + VERSION, rows: rows });
    var ok = false;
    fetch(LOG_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body })
      .then(function () { ok = true; state.outbox = state.outbox.slice(rows.length); save(); status("Sent to VIDPOD"); })
      .catch(function () { status("Offline, kept on this phone"); })
      .then(function () { flush.on = false; if (ok && state.outbox.length) flush(); });
  }
  window.addEventListener("online", flush);

  function copyResults() {
    var lines = ["VIDPOD swipe review, " + new Date().toLocaleString()];
    ["yes", "later", "no"].forEach(function (k) {
      lines.push("", k.toUpperCase());
      QUEUE.forEach(function (it) { if ((state.decisions[it.id] || {}).d === k) lines.push(it.id + "  " + it.title + "  " + (it.link || "")); });
    });
    var t = lines.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast("Copied"); }, function () { prompt("Copy:", t); });
    else prompt("Copy:", t);
  }

  // ---------- gestures ----------
  function bindDrag(card) {
    var sx = 0, sy = 0, dx = 0, dy = 0, down = false, moved = false, pid = null;
    var yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no"), later = card.querySelector(".stamp.later");
    card.addEventListener("pointerdown", function (e) {
      if (e.target.closest("a") || busy) return;
      down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0; pid = e.pointerId;
      try { card.setPointerCapture(pid); } catch (x) {}
      card.classList.remove("snap");
    });
    card.addEventListener("pointermove", function (e) {
      if (!down || e.pointerId !== pid) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
      card.style.transform = "translate(" + dx + "px," + Math.min(dy, 60) + "px) rotate(" + (dx / 18) + "deg)";
      var up = dy < 0 && Math.abs(dy) > Math.abs(dx);
      yes.style.opacity = !up && dx > 0 ? Math.min(dx / 100, 1) : 0;
      no.style.opacity = !up && dx < 0 ? Math.min(-dx / 100, 1) : 0;
      later.style.opacity = up ? Math.min(-dy / 110, 1) : 0;
    });
    function end(e) {
      if (!down || (e && e.pointerId !== pid)) return;
      down = false;
      var lim = Math.min(110, window.innerWidth * 0.26);
      var up = dy < 0 && Math.abs(dy) > Math.abs(dx);
      if (up && -dy > 110) return decide("later");
      if (!up && dx > lim) return decide("yes");
      if (!up && dx < -lim) return decide("no");
      card.classList.add("snap"); card.style.transform = ""; yes.style.opacity = no.style.opacity = later.style.opacity = 0;
      if (!moved) { var v = card.querySelector("video"); if (v) { if (v.paused) v.play(); else v.pause(); } }
    }
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  }

  document.getElementById("bYes").onclick = function () { decide("yes"); };
  document.getElementById("bNo").onclick = function () { decide("no"); };
  document.getElementById("bLater").onclick = function () { decide("later"); };
  document.getElementById("undo").onclick = undo;
  document.getElementById("mode").onclick = function () { setMode(!savedOnly); };
  document.getElementById("summary").onclick = function () {
    Array.prototype.slice.call(stage.querySelectorAll(".card")).forEach(function (c) { c.remove(); });
    current = null; document.getElementById("actions").style.visibility = "hidden"; showDone();
    var back = document.createElement("button"); back.className = "btn"; back.textContent = "Back to swiping"; back.onclick = render;
    doneEl.querySelector(".donebtns").prepend(back);
  };
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") decide("yes", "key");
    else if (e.key === "ArrowLeft") decide("no", "key");
    else if (e.key === "ArrowUp") { e.preventDefault(); decide("later", "key"); }
    else if ((e.key === "z" && (e.metaKey || e.ctrlKey)) || e.key === "Backspace") undo();
  });
})();
</script>
</body>
</html>
